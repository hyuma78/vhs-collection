<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Collezione VHS di Tommy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>La mia Videoteca</h1>
</header>

<section id="griglia">
    <h2>📼 Tutte le VHS</h2>
    <div class="grid" id="grid"></div>
</section>

<div id="infoBox" class="info-box hidden">
    <button id="closeInfo" class="close-btn">✕</button>
    
    <h2 id="infoTitle"></h2>
    <p id="infoAnno"></p>
    <p id="infoTrama"></p>

    <div class="switch-buttons">
        <button id="btnFront">Fronte VHS</button>
        <button id="btnBack">Retro VHS</button>
    </div>

    <div class="info-image-container">
        <img id="infoImage" src="" alt="">
    </div>
</div>

<!-- ⬇️ script spostato QUI, dopo infoBox -->
<script src="main.js"></script>

</body>
</html>
